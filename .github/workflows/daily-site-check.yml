name: Daily site quality check

on:
  schedule:
    # 08:00 Africa/Casablanca (UTC+1 during this schedule period)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-site-quality
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate site links, fragments, sitemap and metadata
        run: python scripts/check_site.py
